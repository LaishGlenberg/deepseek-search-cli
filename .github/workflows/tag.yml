name: Tag release

# Tags only. This workflow never publishes to npm; it creates a GitHub Release
# with auto-generated notes for the tag it pushes.
#
# - Version bumped by the user on merge (tag v<version> missing) -> tag it.
# - Version unchanged (tag v<version> already exists) -> bump a patch version,
#   commit it, then tag it.
# - A tag push does not publish anything; run `npm publish` manually.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify the build before tagging
        run: |
          npm ci
          npm test

      - name: Create tag if needed
        id: tag
        run: |
          set -euo pipefail

          subject="$(git log -1 --pretty=%s)"
          case "${subject}" in
            "chore: release v"*)
              echo "HEAD is a release commit; nothing to do."
              exit 0
              ;;
          esac

          git fetch --tags --force

          # Annotated tags and release commits both need an identity, and CI runners
          # have no global git config.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; bumping a patch version."
            tag="$(npm version patch --no-git-tag-version)"
            git add package.json package-lock.json
            git commit -m "chore: release ${tag}"
            git push origin HEAD:main
          else
            echo "Tag ${tag} does not exist; tagging version ${version}."
          fi

          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.tag.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${{ steps.tag.outputs.name }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; leaving it alone."
            exit 0
          fi

          gh release create "${tag}" --title "${tag}" --verify-tag --generate-notes

      - name: Summary
        run: |
          echo "Tagged $(git describe --tags --exact-match 2>/dev/null || echo 'nothing')"
          echo "GitHub Release notes are generated from the commits since the previous tag."
          echo "No npm publish was performed."
